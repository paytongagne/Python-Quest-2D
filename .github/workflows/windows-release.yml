name: Windows release artifact
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: '1'
      PYTHONQUEST_SAVE: ${{ runner.temp }}/pq-release-profile.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_windows.py --tag "$env:GITHUB_REF_NAME"
      - run: python planning/tools/verify_windows_archive.py "dist/Python-Quest-2D-$env:GITHUB_REF_NAME-Windows-x64.zip" --json dist/archive-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: Python-Quest-2D-${{ github.ref_name }}-Windows-x64
          path: dist/
          if-no-files-found: error
