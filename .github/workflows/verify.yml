name: Verify Python Quest
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: '1'
      PYTHONQUEST_SAVE: ${{ runner.temp }}/pq-ci-profile.json
      PYTHONQUEST_V14_ROOT: ${{ github.workspace }}
      PQ11_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-qa.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_content.py
      - run: python -m unittest discover -s planning/tests -v
