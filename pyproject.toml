[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-quest-2d"
version = "1.4.0"
description = "Astra Research Facility: an offline Python learning adventure"
requires-python = ">=3.10"
dependencies = ["pygame-ce==2.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


